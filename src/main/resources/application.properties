spring.application.name=gym-booking-api

# Miljövariabler
spring.config.import=optional:file:./.env[.properties]

# Server
server.port=${PORT:8080}
app.instance-name=${INSTANCE_NAME:api-1}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${GYM_DB_HOST}:${GYM_DB_PORT}/${GYM_DB_NAME}
spring.datasource.username=${GYM_DB_USER}
spring.datasource.password=${GYM_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false